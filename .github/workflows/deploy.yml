name: Deploy
on:
  workflow_call:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.event_name == 'push' && 'staging' || 'alpha' }}
  cancel-in-progress: false
jobs:
  deploy:
    # Enable only after provisioning and hosted acceptance in web-issues#39.
    if: vars.CMS_DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || (github.event_name == 'release' && github.event.release.prerelease))
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name == 'push' && 'staging' || 'alpha' }}
    env:
      TARGET: ${{ github.event_name == 'push' && 'staging' || 'alpha' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - name: Migrate, deploy and seed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          bun run "migrate:$TARGET"
          bun run "deploy:$TARGET"
          bun run "seed:$TARGET"
      - name: Verify public content and English coverage
        env:
          CMS_ADMIN_TOKEN: ${{ secrets.CMS_ADMIN_TOKEN }}
        run: node scripts/smoke.mjs "https://cms-$TARGET.astrologyengine.dev"
